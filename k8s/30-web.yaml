# Next.js 프론트엔드 (standalone) — /api 요청은 서버사이드 rewrite로 내부 api 서비스에 프록시
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: jasheets
spec:
  replicas: 1
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      imagePullSecrets:
        - name: harbor-pull-secret
      containers:
        - name: web
          image: harbor.internal/jasheets/web:0.2.1 # 실제 Harbor 주소/프로젝트로 변경
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: API_URL
              value: http://api:4000
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: jasheets
spec:
  selector: { app: web }
  ports:
    - port: 3000
      targetPort: 3000
