# NestJS API 서버 — 마이그레이션은 initContainer에서 prisma migrate deploy로 수행
apiVersion: v1
kind: Secret
metadata:
  name: jasheets-api-secret
  namespace: jasheets
type: Opaque
stringData:
  # 배포 전 반드시 변경하세요 (예: openssl rand -hex 32)
  JWT_SECRET: change-me-in-production
  DATABASE_URL: postgresql://jasheets:change-me-in-production@postgres:5432/jasheets
  # Keycloak 클라이언트 시크릿 (Keycloak 관리 콘솔 > Clients > jasheets > Credentials에서 복사)
  KEYCLOAK_CLIENT_SECRET: paste-keycloak-client-secret-here
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jasheets-api-config
  namespace: jasheets
data:
  API_PORT: "4000"
  JWT_EXPIRES_IN: "7d"
  CORS_ORIGIN: "http://jasheets.local" # Ingress 호스트에 맞게 변경
  PUBLIC_APP_URL: "http://jasheets.local" # 브라우저 기준 앱 주소 (Ingress 호스트)
  # AI_BASE_URL: ""  # 폐쇄망 내부 OpenAI 호환 LLM(vLLM/Ollama)이 있을 때만 설정
  # --- Keycloak SSO (사용 시 주석 해제, KEYCLOAK_CLIENT_SECRET은 Secret에) ---
  KEYCLOAK_URL: "http://keycloak.jasheets.local" # 브라우저가 접근하는 Keycloak 주소
  KEYCLOAK_INTERNAL_URL: "http://keycloak:8080" # 백엔드→Keycloak 클러스터 내부 주소
  KEYCLOAK_REALM: "jasheets"
  KEYCLOAK_CLIENT_ID: "jasheets"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: jasheets
spec:
  replicas: 1 # Socket.IO 사용 — 2개 이상으로 늘리려면 redis adapter + sticky session 필요
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      imagePullSecrets:
        - name: harbor-pull-secret
      initContainers:
        - name: migrate
          image: harbor.internal/jasheets/api:0.2.0 # 실제 Harbor 주소/프로젝트로 변경
          imagePullPolicy: IfNotPresent
          command: ["npx", "prisma", "migrate", "deploy"]
          envFrom:
            - secretRef: { name: jasheets-api-secret }
      containers:
        - name: api
          image: harbor.internal/jasheets/api:0.2.0 # 실제 Harbor 주소/프로젝트로 변경
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          envFrom:
            - secretRef: { name: jasheets-api-secret }
            - configMapRef: { name: jasheets-api-config }
          readinessProbe:
            tcpSocket: { port: 4000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: jasheets
spec:
  selector: { app: api }
  ports:
    - port: 4000
      targetPort: 4000
