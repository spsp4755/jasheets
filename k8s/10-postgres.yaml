# PostgreSQL — 단일 인스턴스 (폐쇄망 내부 데이터 저장소)
apiVersion: v1
kind: Secret
metadata:
  name: jasheets-db-secret
  namespace: jasheets
type: Opaque
stringData:
  POSTGRES_DB: jasheets
  POSTGRES_USER: jasheets
  # 배포 전 반드시 변경하세요
  POSTGRES_PASSWORD: change-me-in-production
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jasheets-postgres-pvc
  namespace: jasheets
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: jasheets
spec:
  replicas: 1
  strategy:
    type: Recreate # PVC(RWO) 재접속을 위해 롤링 대신 재생성
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      imagePullSecrets:
        - name: harbor-pull-secret
      containers:
        - name: postgres
          image: harbor.internal/jasheets/postgres:16-alpine # Harbor로 재푸시한 이미지 (실제 주소로 변경)
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef: { name: jasheets-db-secret }
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "jasheets", "-d", "jasheets"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: jasheets-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: jasheets
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
      targetPort: 5432
